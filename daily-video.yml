name: Arabic Video Agent

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "ملف إعدادات المشاهد"
        required: false
        default: "config.example.json"
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install piper-tts

      - name: Check project files
        run: |
          test -f generate_video.py
          test -f config.example.json
          python -m json.tool config.example.json

      - name: Download Arabic voice model (Piper)
        run: |
          mkdir -p voices
          curl -L -o voices/ar_JO-kareem-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx"
          curl -L -o voices/ar_JO-kareem-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json"

      - name: Generate video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIPER_VOICE: voices/ar_JO-kareem-medium.onnx
        run: |
          python generate_video.py \
            --config "${{ github.event.inputs.config_file || 'config.example.json' }}" \
            --output output_video.mp4

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: output_video.mp4
          retention-days: 7
